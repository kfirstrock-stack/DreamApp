# Free Supabase projects pause after about a week without activity.
# These requests are read-only GETs: a row from `photos` (hits the database)
# and auth health. No writes.
# A table read alone was not enough in November 2026, so each run touches both.
# GitHub disables scheduled workflows after 60 days without a commit in the repo.
# Once a month this job writes .github/keepalive.txt so the schedule stays on.
name: Supabase keepalive

on:
  schedule:
    # 06:17 UTC every other day (1st, 3rd, 5th, …)
    - cron: '17 6 */2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://xxuzjmjkgfjxmdqehvap.supabase.co
      PROD_ANON_KEY: sb_publishable_-P83XQ3cpD__9W51C4eQvA_L01uwA08
      TEST_URL: https://wmyinjftktwvjvcvclph.supabase.co
      TEST_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndteWluamZ0a3R3dmp2Y3ZjbHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4OTIyMzIsImV4cCI6MjExMDQ2ODIzMn0.wkpsyfbCEEb-f-bDSbxzQ8mW1wq8HbBUTzgloyHTcFg
    steps:
      - uses: actions/checkout@v4

      - name: Read-only GET to prod and test
        run: bash scripts/keepalive.sh

      - name: Monthly heartbeat so GitHub does not disable the schedule
        run: |
          month=$(date -u +%Y-%m)
          current=$(cat .github/keepalive.txt 2>/dev/null || true)
          if [ "$current" = "$month" ]; then
            echo "Heartbeat already $month"
            exit 0
          fi
          echo "$month" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive: $month"
          git push
