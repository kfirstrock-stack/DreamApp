# Supabase на бесплатном плане ставит проект на паузу после ~7 дней без активности.
# Раз в три дня делаем один лёгкий запрос на чтение — этого достаточно, чтобы проект не засыпал.
# Ключ — публичный (publishable), он и так лежит в приложении; данные под защитой правил доступа.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *' # раз в 3 дня, 06:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Лёгкий запрос к базе
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://xxuzjmjkgfjxmdqehvap.supabase.co/rest/v1/photos?select=id&limit=1" \
            -H "apikey: sb_publishable_-P83XQ3cpD__9W51C4eQvA_L01uwA08")
          echo "HTTP $code"
          test "$code" = "200"
